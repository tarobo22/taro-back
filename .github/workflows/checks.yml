name: FastAPI checks
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taro_journal_test
          POSTGRES_USER: taro_test
          POSTGRES_PASSWORD: local_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U taro_test -d taro_journal_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      YEOUN_TEST_DATABASE_URL: postgresql://taro_test:local_test_only@127.0.0.1:5432/taro_journal_test
      DATABASE_URL: postgresql://taro_test:local_test_only@127.0.0.1:5432/taro_journal_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt -c constraints-dev.txt
      - run: python -m api.migrate
      - run: python -m pytest -q
      - run: python -m api.export_openapi
      - run: git diff --exit-code -- docs/contracts/openapi.json
